name: Android quality and build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test and build Android
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Run Android lint
        run: gradle --no-daemon :app:lintDebug

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Restore release signing key (optional)
        env:
          NEXORA_KEYSTORE_BASE64: ${{ secrets.NEXORA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$NEXORA_KEYSTORE_BASE64" ]; then
            printf '%s' "$NEXORA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nexora-release.jks"
            echo "NEXORA_KEYSTORE_PATH=$RUNNER_TEMP/nexora-release.jks" >> "$GITHUB_ENV"
          else
            echo "NEXORA_KEYSTORE_PATH=" >> "$GITHUB_ENV"
            echo "No release keystore secret configured; producing an unsigned release APK."
          fi

      - name: Assemble release APK
        env:
          NEXORA_ADMOB_APP_ID: ${{ secrets.NEXORA_ADMOB_APP_ID }}
          NEXORA_ADMOB_BANNER_ID: ${{ secrets.NEXORA_ADMOB_BANNER_ID }}
          NEXORA_KEYSTORE_PASSWORD: ${{ secrets.NEXORA_KEYSTORE_PASSWORD }}
          NEXORA_KEY_ALIAS: ${{ secrets.NEXORA_KEY_ALIAS }}
          NEXORA_KEY_PASSWORD: ${{ secrets.NEXORA_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nexora-utility-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: nexora-utility-release-unsigned-or-signed
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
