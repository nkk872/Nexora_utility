name: Android build, lint and tests

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-ci.yml'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'app/**'
      - 'nexora-android-source.zip'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/android-ci.yml'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'app/**'
      - 'nexora-android-source.zip'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexora-android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-android:
    name: Verify Android project
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore native Android source archive (if present)
        shell: bash
        run: |
          set -euo pipefail
          if [ -f nexora-android-source.zip ]; then
            unzip -oq nexora-android-source.zip -d .
          fi

      - name: Verify native Android project is present
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradle/libs.versions.toml
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/nexora/utility/MainActivity.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Generate wrapper if repository does not include one
        shell: bash
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.9 --distribution-type bin
          fi
          chmod +x gradlew

      - name: Compile Kotlin and run Android lint
        run: ./gradlew --no-daemon --stacktrace :app:compileDebugKotlin :app:lintDebug

      - name: Run unit tests
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Decode optional release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.NEXORA_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nexora-release.jks"
            echo "NEXORA_KEYSTORE_PATH=$RUNNER_TEMP/nexora-release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build release APK (signed when owner secrets are configured)
        env:
          NEXORA_KEYSTORE_PASSWORD: ${{ secrets.NEXORA_KEYSTORE_PASSWORD }}
          NEXORA_KEY_ALIAS: ${{ secrets.NEXORA_KEY_ALIAS }}
          NEXORA_KEY_PASSWORD: ${{ secrets.NEXORA_KEY_PASSWORD }}
          NEXORA_ADMOB_APP_ID: ${{ secrets.NEXORA_ADMOB_APP_ID }}
          NEXORA_ADMOB_BANNER_ID: ${{ secrets.NEXORA_ADMOB_BANNER_ID }}
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Build release Android App Bundle (signed when owner secrets are configured)
        env:
          NEXORA_KEYSTORE_PASSWORD: ${{ secrets.NEXORA_KEYSTORE_PASSWORD }}
          NEXORA_KEY_ALIAS: ${{ secrets.NEXORA_KEY_ALIAS }}
          NEXORA_KEY_PASSWORD: ${{ secrets.NEXORA_KEY_PASSWORD }}
          NEXORA_ADMOB_APP_ID: ${{ secrets.NEXORA_ADMOB_APP_ID }}
          NEXORA_ADMOB_BANNER_ID: ${{ secrets.NEXORA_ADMOB_BANNER_ID }}
        run: ./gradlew --no-daemon --stacktrace :app:bundleRelease

      - name: Upload APK outputs
        uses: actions/upload-artifact@v4
        with:
          name: nexora-utility-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
